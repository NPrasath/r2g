name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-content:
    name: Training content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate training assets
        run: python3 scripts/validate_training_kit.py

  dotnet:
    name: .NET build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Record SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore R2G.Training.sln
      - name: Build
        run: dotnet build R2G.Training.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test R2G.Training.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Preserve test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
